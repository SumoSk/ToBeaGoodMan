function audit(){const p=$("main");p.replaceChildren(el("h2","","ตรวจความเชื่อมโยงที่ระบุไว้"),el("p","",ix.links.length+" เส้น parent/stage ที่สกัดจากข้อมูล"),el("p","",ix.unknown.length+" parent ที่หาไม่พบ"),el("p","warning","ไม่ถือว่าเรื่องที่ไม่มี parent เป็นบั๊ก เพราะหลายเรื่องเกิดจากเงื่อนไข runtime ที่ไม่ใช่การอ้าง ID โดยตรง"));for(const x of ix.unknown.slice(0,200))p.append(el("p","",x.id+" → "+x.parent));const repeats=new Map();for(const e of data.events){const k=family(e)+"|"+e.title;repeats.set(k,(repeats.get(k)||0)+1)}p.append(el("h3","","ชื่อเทมเพลตซ้ำมากที่สุด (ไม่ใช่จำนวนที่ผู้เล่นพบจริง)"));for(const [k,v] of [...repeats].sort((a,b)=>b[1]-a[1]).slice(0,30))p.append(el("div","box",v+" · "+k))}
