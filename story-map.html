<script>
(function(root){"use strict";
const domains={life:["ชีวิต","#a1b1c5"],education:["การศึกษา","#6dbb91"],career:["อาชีพ","#75a9e0"],money:["เงินและธุรกิจ","#e4b36c"],love:["ความรัก","#e599c2"],family:["ครอบครัว","#c6a1e7"],friend:["เพื่อน","#70c6cc"],skill:["ความถนัด","#c2cf81"],health:["สุขภาพ","#e38f86"],ethics:["ศีลธรรม","#b7a8d6"]},types={start:"เริ่มต้น",decision:"ตัดสินใจ",state:"สถานะ",consequence:"ผลตามมา",merge:"จุดบรรจบ",pause:"พักเรื่อง",end:"สิ้นสุด",memo:"โน้ตแปะ"};
const clone=x=>JSON.parse(JSON.stringify(x));
const taskStates={pending:"รอทำ",doing:"กำลังทำ",done:"ทำแล้ว",deferred:"ยังไม่ได้ทำ",blocked:"ทำไม่ได้ / ติดปัญหา",discuss:"ต้องคุยกัน"};
function taskMeta(x){return {taskNote:typeof x.taskNote==="string"?x.taskNote:"",taskStatus:Object.hasOwn(taskStates,x.taskStatus)?x.taskStatus:"pending",taskReview:typeof x.taskReview==="string"?x.taskReview:""}}
function hasTask(x){const m=taskMeta(x);return !!(m.taskNote.trim()||m.taskReview.trim()||m.taskStatus!=="pending")}
function collectTasks(entries){const rows=[];for(const [id,g] of entries){const names=new Map(g.nodes.map(n=>[n.id,n.title]));for(const [kind,items] of [["node",g.nodes],["edge",g.edges]])for(const item of items){if(!hasTask(item))continue;const title=kind==="node"?item.title:(names.get(item.from)||item.from)+" → "+(names.get(item.to)||item.to)+" · "+item.label;rows.push({tab:id,id:item.id,kind,title,...taskMeta(item)})}}return rows}

const SOURCE_ROOT="__actual_story_root__",SOURCE_PREFIX="__actual_story_";
const sourceNames={base:"เรื่องหลักและเหตุการณ์เดิม",annual:"เหตุการณ์รายปี",teen40:"ความรักวัยรุ่น",rel40:"ความสัมพันธ์และเพื่อน",youth:"การศึกษาและมหาวิทยาลัย",teenstories:"เส้นเรื่องวัยรุ่น",womanstory:"ความสัมพันธ์",womanselect:"เลือกคนที่สนใจ",adultx:"ชีวิตการทำงาน",adultfamily:"ชีวิตคู่และครอบครัว",authored:"เส้นเรื่องต่อเนื่อง",impact:"ฐานะ พื้นที่ และค่าพลัง",workopportunity:"โอกาสด้านอาชีพ",explore:"สำรวจอาชีพ",group:"เลือกกลุ่มอาชีพ",pick:"เลือกอาชีพ",bridge:"พื้นฐานอาชีพ",train:"เตรียมอาชีพ",entry:"เข้าสู่อาชีพ",case:"เหตุการณ์เฉพาะอาชีพ",follow:"ผลจากเหตุการณ์อาชีพ",rank:"เติบโตในอาชีพ"};
function sourceFamily(e){return String(e.cw||(e.flex?"flex:"+e.flex:e.later?"later:"+e.later:e.merge?"merge:"+e.merge:e.freedom?"freedom:"+e.freedom:e.annual?"annual":"base"))}
function sourceSub(e){const k=["tsKey","vyKey","womanKey","wg","arcKey","ydKey","ylKey","cwProfession","imKind","youth","relKind","teenKind","ax","afType","elderx"].find(k=>typeof e[k]==="string"&&e[k]);return k?String(e[k]):""}
function sourceDomain(e){const k=(sourceFamily(e)+" "+e.id).toLowerCase();if(/health|illness|death|hospital|carepaid|careconflict/.test(k))return "health";if(/rel40|teen40|woman|romance|love|date|crush|breakup/.test(k))return "love";if(/family|child|parent|marry|marriage|kid|spouse/.test(k))return "family";if(/friend|social/.test(k))return "friend";if(/youth|school|study|exam|student|education|admission|university/.test(k))return "education";if(/business|wealth|money|debt|invest|loan|saving|salary/.test(k))return "money";if(/career|work|job|^cw_|^case |^group |^pick |^bridge |^train |^entry |^rank |^explore |^follow /.test(k)||e.cw)return "career";if(/hobby|sport|skill|game|music|interest/.test(k))return "skill";if(/ethic|corrupt|moral/.test(k))return "ethics";return "life"}
function buildSourceTree(data){const nodes=new Map(),children=new Map(),eventNodes=new Map(),rows=new Map(),links=new Map();let serial=0;
 const add=(parent,title,domain,count,event=null,id=null)=>{const n={id:id||SOURCE_PREFIX+(++serial),parent,title,domain,ageMin:event?.age??0,ageMax:event?.age??100,type:event?"decision":"state",requires:"",effects:"",characters:"",note:"",x:0,y:0,virtual:true,count,event};nodes.set(n.id,n);if(!children.has(parent))children.set(parent,[]);children.get(parent).push(n);if(event)eventNodes.set(event.id,n.id);return n};
 const bins=(items,max=8)=>{const out=[];for(let i=0;i<items.length;i+=max)out.push(items.slice(i,i+max));return out};
 function chunk(parent,items,label,domain,emit,count=x=>1){if(items.length<=8){items.forEach(x=>emit(parent,x));return}const batch=Math.pow(8,Math.ceil(Math.log(items.length)/Math.log(8))-1);for(const [i,part] of bins(items,batch).entries()){const n=add(parent,label+" "+(i*batch+1)+"–"+(i*batch+part.length),domain,part.reduce((s,x)=>s+count(x),0));chunk(n.id,part,label,domain,emit,count)}}
 const families=new Map();
 for(const e of data.events){rows.set(e.id,e);const domain=sourceDomain(e);if(!families.has(domain))families.set(domain,new Map());const f=families.get(domain),key=sourceFamily(e);if(!f.has(key))f.set(key,[]);f.get(key).push(e)}
 for(const [domain,fs] of families){const groups=[...fs].sort((a,b)=>b[1].length-a[1].length),n=add(SOURCE_ROOT,domains[domain][0],domain,groups.reduce((s,x)=>s+x[1].length,0));chunk(n.id,groups,"กลุ่มระบบ",domain,(p,[key,events])=>{const g=add(p,sourceNames[key]||key,domain,events.length);const ss=new Map();for(const e of events){const k=sourceSub(e)||"เรื่องในกลุ่ม";if(!ss.has(k))ss.set(k,[]);ss.get(k).push(e)}const list=[...ss];const emit=(parent,es)=>{const sorted=es.slice().sort((a,b)=>a.age-b.age||a.id.localeCompare(b.id));chunk(parent,sorted,"เหตุการณ์",domain,(pp,e)=>add(pp,e.title||e.id,domain,1,e))};if(list.length===1)emit(g.id,list[0][1]);else chunk(g.id,list,"เส้นย่อย",domain,(pp,[sub,es])=>{const x=add(pp,sub,domain,es.length);emit(x.id,es)},x=>x[1].length)},x=>x[1].length)}
 for(const e of data.events){for(const parent of new Set([e.after,Array.isArray(e.when)?e.when[0]:null].filter(Boolean))){if(!rows.has(parent))continue;const addLink=(id,other,direction)=>{if(!links.has(id))links.set(id,[]);links.get(id).push({id:other,direction})};addLink(e.id,parent,"←");addLink(parent,e.id,"→")}}
 return {nodes,children,eventNodes,rows,links,stats:data.stats||{},total:data.events.length};
}

function sqlSchema(t){const lit="'"+String(t).replace(/'/g,"''")+"'";return "CREATE TABLE tabs(id TEXT PRIMARY KEY NOT NULL,title TEXT NOT NULL,play_json TEXT NOT NULL DEFAULT '');"+"CREATE TABLE variables(id TEXT PRIMARY KEY NOT NULL,definition_json TEXT NOT NULL,trial_json TEXT NOT NULL DEFAULT '');"+"CREATE TABLE mechanisms(id TEXT PRIMARY KEY NOT NULL,definition_json TEXT NOT NULL);"+

async function openStudioCloud(){

 const m=C.modal("Life Story Studio · Cloud");
 const cloud=C.studio;
 async function doSave(asNew){
  const payload=backupData(),raw=JSON.stringify(payload);
  if(!asNew&&cloudMeta?.hash===cloudFingerprint(raw)){m.msg.textContent="ไม่มีการเปลี่ยนแปลงที่ต้องอัปโหลด";return}
  const id=asNew||!cloudMeta?.id?crypto.randomUUID():cloudMeta.id,rev=asNew?0:(cloudMeta?.revision||0);

  const next=await cloud.save(id,rev,title,payload);

  await draw();m.msg.textContent="บันทึก Cloud v"+next+" แล้ว";
 }
 async function draw(){
  m.body.replaceChildren();m.body.append(C.node("p",cloudMeta?.id?"โครงการที่เชื่อมอยู่: "+cloudMeta.title+" · v"+cloudMeta.revision:"ยังไม่ได้เชื่อมโครงการ Cloud"));
  C.action(m.body,"บันทึกขึ้น Cloud",()=>doSave(false),m);
  C.action(m.body,"บันทึกเป็นโครงการใหม่",()=>doSave(true),m);
  const rows=await cloud.list();
  for(const r of rows){const card=C.node("section");card.className="gc-row";card.append(C.node("strong",r.title+" · v"+r.revision),C.node("small",new Date(r.updated_at).toLocaleString("th-TH")));

   C.action(card,"ประวัติเวอร์ชัน",async()=>{const rows=await cloud.history(r.project_id);const list=C.node("div");for(const v of rows)C.action(list,"v"+v.revision+" · "+new Date(v.created_at).toLocaleString("th-TH"),async()=>{const latest=await cloud.read(r.project_id),raw=await cloud.revision(r.project_id,v.revision);if(cloudApply(raw)){rememberCloud({id:r.project_id,title:latest.title,revision:latest.revision,hash:null});m.d.close()}},m);card.append(list)},m);

  }
