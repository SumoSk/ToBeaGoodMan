name: Studio flow browser
on:
  push:
    branches: [main]
    paths: ['studio-flow*.js', 'studio-flow.css', 'studio-design.js', 'story-map.html', 'tests/studio-flow*', '.github/workflows/studio-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/studio-flow.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/studio-server.log 2>&1 &
          node tests/studio-flow-browser.cjs
