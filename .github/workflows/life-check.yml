name: Life simulation checks
on:
  push:
    branches: [main]
    paths: ['*.js', 'index.html', 'tests/**', '.github/workflows/life-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/life-smoke.cjs
