<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To Be a Good Man</title><style>
:root{color-scheme:dark;--bg:#171819;--panel:#232527;--ink:#f5f0e6;--muted:#a8aaa6;--gold:#dbbd85;--line:#3c3e40}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34312a 0%,var(--bg) 54%);font-family:system-ui,sans-serif;color:var(--ink);min-height:100dvh}main{max-width:760px;margin:auto;padding:24px 18px 56px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 22px;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.08em;font-weight:bold}.brand span{color:var(--gold)}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px;text-align:left;transition:background .15s,border-color .15s}button:hover,button:focus-visible{border-color:var(--gold);background:#38352f}button.primary{background:var(--gold);color:#171819;font-weight:700;text-align:center}button.small{font-size:13px;padding:8px 12px}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin:0}h1{font-family:Georgia,serif;font-size:clamp(38px,8vw,74px);line-height:1.05;color:var(--gold)}h2{font-size:clamp(25px,5vw,35px);line-height:1.35}p{line-height:1.85}.muted{color:var(--muted);font-size:14px}.kicker{color:var(--gold);font-size:13px;letter-spacing:.09em;font-weight:bold}.scene{padding:28px 0;display:grid;gap:18px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;min-height:58px}.letter{color:var(--gold);font-family:Georgia,serif;min-width:22px}.meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.track{height:3px;background:var(--line);margin-top:8px;overflow:hidden;border-radius:5px}.track i{display:block;background:var(--gold);height:100%}.result{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:16px;display:grid;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:10px}.actions button{flex:1;text-align:center}.journal{display:grid;gap:12px}.entry{padding:12px 0;border-bottom:1px solid var(--line)}.entry strong{display:block;margin-bottom:5px}footer{border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px;line-height:1.6}#notice{font-size:12px;color:var(--gold);min-height:18px;margin-top:8px} @media(max-width:480px){main{padding:16px 14px 32px}.brand{font-size:15px}.scene{padding:22px 0}.choice{padding:12px}.meta{font-size:12px}}
</style></head><body><main><header><div class="brand">TO BE A <span>GOOD MAN.</span></div><button id="menu" class="small" type="button">บันทึกชีวิต</button></header><div id="notice" role="status"></div><section id="app" aria-live="polite"></section><footer>เกมเรื่องแต่งเพื่อความบันเทิง การตัดสินใจในเกมไม่ใช่แบบประเมินความดีหรือคุณค่าของผู้เล่นจริง</footer></main><script src="story.js"></script><script src="more-stories.js"></script><script>
"use strict";
const events=window.STORY.slice().sort((a,b)=>a.age-b.age), key="tbagm-save-v1", app=document.getElementById("app"), notice=document.getElementById("notice");
const labels={e:"ความเห็นอกเห็นใจ",i:"ความซื่อตรง",c:"ความกล้า",r:"ความสัมพันธ์",h:"สุขภาวะ",m:"เงิน"};
const money=n=>Number(n).toLocaleString("th-TH")+" บาท";
const fresh=()=>({version:1,at:0,answers:{},stats:{e:50,i:50,c:50,r:50,h:50,m:0},history:[],pending:null,done:false});
let s=null,view="start";
function save(){try{localStorage.setItem(key,JSON.stringify(s));notice.textContent="บันทึกอัตโนมัติแล้ว"}catch{notice.textContent="บันทึกไม่ได้ในเบราว์เซอร์นี้"}}
function load(){try{const x=JSON.parse(localStorage.getItem(key));if(x&&x.version===1&&Number.isInteger(x.at)&&x.at>=0&&x.at<=events.length&&x.stats&&x.answers&&Array.isArray(x.history))return x}catch{}return null}
function el(tag,text,cls){const a=document.createElement(tag);if(text!==undefined)a.textContent=text;if(cls)a.className=cls;return a}
function btn(label,fn,cls){const b=el("button",label,cls);b.type="button";b.onclick=fn;return b}
function add(parent,...children){parent.append(...children);return parent}
function allowed(e){return !e.when||e.when[1].includes(s.answers[e.when[0]])}
function advance(){while(s.at<events.length&&!allowed(events[s.at]))s.at++;s.done=s.at>=events.length}
function begin(){s=fresh();advance();save();view="play";render()}
function restore(){s=load();if(!s)return begin();advance();view="play";render()}
function choose(e,n){if(s.pending||s.done||events[s.at]!==e||!e.choices[n])return;const c=e.choices[n];s.answers[e.id]=n;const changes={};for(const [k,v] of Object.entries(c.delta)){const old=s.stats[k];s.stats[k]=k==="m"?old+v:Math.max(0,Math.min(100,old+v));changes[k]=s.stats[k]-old}s.history.push({id:e.id,age:e.age,title:e.title,label:c.label,result:c.result});s.pending={id:e.id,result:c.result,label:c.label,changes};save();render()}
function next(){if(!s.pending)return;s.pending=null;s.at++;advance();save();render()}
function newGame(){if(s&&!s.done&&!confirm("เริ่มชีวิตใหม่และแทนที่บันทึกเดิมหรือไม่?"))return;begin()}
function scene(){const a=el("div",undefined,"scene");app.replaceChildren(a);return a}
function render(){document.getElementById("menu").textContent=view==="journal"?"กลับไปเล่น":"บันทึกชีวิต";
if(view==="start"){const a=scene();add(a,el("div","เรื่องราวของชีวิต • บทที่หนึ่ง","kicker"),el("h1","To Be a Good Man."),el("p","คุณไม่ได้เลือกที่จะเกิด แต่คุณเลือกได้ว่าจะใช้ชีวิตอย่างไร"),el("p","จากวัยเด็กไปจนถึงวัยชรา พบเพื่อน ความรัก เงิน งาน และเรื่องที่ไม่มีคำตอบง่ายๆ ทุกการเลือกจะทิ้งร่องรอยไว้","muted"));const acts=el("div",undefined,"actions");if(load())add(acts,btn("เล่นต่อ",restore,"primary"),btn("เริ่มชีวิตใหม่",()=>{if(confirm("แทนที่บันทึกเดิมหรือไม่?"))begin()}));else add(acts,btn("เริ่มต้นชีวิต",begin,"primary"));a.append(acts);return}
if(!s){view="start";return render()}
if(view==="journal"){const a=scene();add(a,el("div","สมุดบันทึก","kicker"),el("h2","เรื่องราวที่ผ่านมา"));const j=el("div",undefined,"journal");if(!s.history.length)j.append(el("p","ยังไม่มีการตัดสินใจ","muted"));for(const item of [...s.history].reverse()){const d=el("div",undefined,"entry");add(d,el("strong","อายุ "+item.age+" • "+item.title),el("p",item.label),el("p",item.result,"muted"));j.append(d)}add(a,j,btn("กลับไปเล่น",()=>{view="play";render()}),btn("เริ่มชีวิตใหม่",newGame));return}
if(s.done){const a=scene();const traits=[["e","การใส่ใจผู้อื่น"],["i","ความซื่อตรง"],["c","การกล้าเผชิญปัญหา"],["r","สายสัมพันธ์"],["h","การดูแลตัวเอง"]].sort((x,y)=>s.stats[y[0]]-s.stats[x[0]]);let ending=s.stats.m>=80000&&s.stats.r<48?"ความสำเร็จที่มีราคาของมัน":s.stats.r>=70&&s.stats.h>=55?"ชีวิตที่เต็มไปด้วยสายสัมพันธ์":s.stats.i<38?"อดีตที่ยังตามมา":s.stats.h<40?"ชีวิตที่ควรได้พักมากกว่านี้":"ชีวิตที่ยังมีทั้งแสงและเงา";add(a,el("div","บทส่งท้าย • อายุ 70 ปี","kicker"),el("h2",ending),el("p","เมื่อมองย้อนกลับไป คุณผ่านทั้งวันที่ตัดสินใจได้ดีและวันที่อยากแก้ไข ชีวิตไม่อาจสรุปเป็นคะแนนเดียวได้ สิ่งที่คุณเลือกได้ทิ้งร่องรอยในเรื่องราวนี้"),el("p","ด้านที่โดดเด่นในชีวิตนี้: "+traits[0][1]+" • เงินคงเหลือ "+money(s.stats.m)+" • "+s.history.length+" การตัดสินใจ","muted"));const result=el("div",undefined,"result");for(const [k,v] of Object.entries(s.stats))if(k!=="m")result.append(el("p",labels[k]+" "+v+"/100"));add(a,result,btn("ย้อนอ่านเรื่องราว",()=>{view="journal";render()}),btn("ใช้ชีวิตอีกครั้ง",newGame,"primary"));return}
const e=events[s.at];const meta=el("div",undefined,"meta");add(meta,el("span","อายุ "+e.age+" ปี"),el("span","เงิน "+money(s.stats.m)),el("span","เหตุการณ์ที่ "+(s.history.length+(s.pending?0:1))));app.replaceChildren(meta);const track=el("div",undefined,"track"),bar=el("i");bar.style.width=(e.age/70*100)+"%";track.append(bar);app.append(track);const a=el("div",undefined,"scene");app.append(a);add(a,el("div",e.age<7?"บทวัยเยาว์":e.age<18?"บทการเติบโต":e.age<30?"บททางเลือก":e.age<50?"บทความรับผิดชอบ":"บทมรดกชีวิต","kicker"),el("h2",e.title),el("p",e.story));
if(s.pending){const box=el("div",undefined,"result");add(box,el("div","สิ่งที่เกิดขึ้น","kicker"),el("p",s.pending.result));const effects=Object.entries(s.pending.changes).filter(([,v])=>v!==0).map(([k,v])=>labels[k]+" "+(v>0?"+":"")+v.toLocaleString("th-TH")+(k==="m"?" บาท":"")).join(" · ");if(effects)box.append(el("p",effects,"muted"));add(a,box,btn("ใช้ชีวิตต่อไป",next,"primary"));return}
const choices=el("div",undefined,"choices");e.choices.forEach((c,n)=>{const b=btn("",()=>choose(e,n),"choice");add(b,el("span",String.fromCharCode(65+n)+".","letter"),el("span",c.label));choices.append(b)});add(a,el("p","คุณจะทำอย่างไร?","muted"),choices)}
document.getElementById("menu").onclick=()=>{if(!s){s=load();if(!s)return}view=view==="journal"?"play":"journal";render()};render();
</script></body></html>
