"use strict";
function buildTimeline(base,episodes){const roots=base.slice().sort((a,b)=>a.age-b.age),out=[],children=new Map(),ids=new Set(roots.map(e=>e.id));for(const e of episodes){if(ids.has(e.id))throw Error("Duplicate story ID: "+e.id);ids.add(e.id);if(!children.has(e.after))children.set(e.after,[]);children.get(e.after).push(e)}function visit(e,age,arc,depth){out.push({...e,age,arc,depth});for(const child of children.get(e.id)||[])visit(child,age,arc,depth+1)}for(const e of roots)visit(e,e.age,e.title,0);if(out.length!==base.length+episodes.length)throw Error("Invalid episode connection");return out}
const events=buildTimeline(window.STORY,window.EPISODES), oldEvents=window.BASE_STORY.slice().sort((a,b)=>a.age-b.age), key="tbagm-save-v1", app=document.getElementById("app"), notice=document.getElementById("notice");
const LIFE=window.LIFE,labels=LIFE.labels,ORIGIN=window.ORIGIN;
const originSets={place:ORIGIN.places,family:ORIGIN.families,home:ORIGIN.homes};
function normalizeOrigin(o){if(!o)return null;const name=typeof o.name==="string"?o.name.trim().slice(0,40):"";if(!Object.keys(originSets).every(k=>Object.hasOwn(originSets[k],o[k])))return null;return {name:name||"ตัวเรา",province:typeof o.province==="string"?o.province.trim().slice(0,40):"",place:o.place,family:o.family,home:o.home}}
function originStats(o){const stats=LIFE.initial();if(o)for(const [k,choices] of Object.entries(originSets))LIFE.apply(stats,choices[o[k]].delta);return stats}
const money=n=>Number(n).toLocaleString("th-TH")+" บาท";
const fresh=(o=null)=>({version:3,at:0,atId:events[0]?.id??null,answers:{},origin:normalizeOrigin(o),stats:originStats(normalizeOrigin(o)),history:[],pending:null,last:null,done:false});
let s=null,view="start";const openGroups=new Set();
function save(){s.version=3;s.atId=s.done?null:events[s.at]?.id??null;try{localStorage.setItem(key,JSON.stringify(s));notice.textContent="บันทึกอัตโนมัติแล้ว"}catch{notice.textContent="บันทึกไม่ได้ในเบราว์เซอร์นี้"}}
function load(){try{const x=JSON.parse(localStorage.getItem(key));if(!x||![1,2,3].includes(x.version)||!Number.isInteger(x.at)||x.at<0||!x.stats||!x.answers||!Array.isArray(x.history)||!LIFE.core.every(k=>Number.isFinite(x.stats[k])))return null;
if(x.version<3){const stats=LIFE.initial();for(const item of x.history){const e=events.find(v=>v.id===item.id),n=x.answers[item.id];if(e&&e.choices[n]){const d=LIFE.delta(e,n);for(const k of LIFE.cash)delete d[k];LIFE.apply(stats,d,true)}}x.stats={...stats,...x.stats};x.stats.debt=Math.max(0,-x.stats.m)}else if(!Object.keys(labels).every(k=>Number.isFinite(x.stats[k])))return null;
x.origin=normalizeOrigin(x.origin);if(x.done){x.at=events.length;x.atId=null;x.version=3;return x}
const id=x.pending?.id||(x.version===1?oldEvents[x.at]?.id:x.atId);const index=events.findIndex(e=>e.id===id);if(index<0)return null;
x.at=index;x.atId=id;x.version=3;return x}catch{}return null}
function el(tag,text,cls){const a=document.createElement(tag);if(text!==undefined)a.textContent=text;if(cls)a.className=cls;return a}
function btn(label,fn,cls){const b=el("button",label,cls);b.type="button";b.onclick=fn;return b}
function add(parent,...children){parent.append(...children);return parent}
function allowed(e){const state=lifeState();if(e.need&&!Object.entries(e.need).every(([k,v])=>state[k]===v))return false;if(e.city&&s.origin?.province!==e.city)return false;if(e.id==="career_select"&&![0,1,2,3,4].includes(s.answers.route))return false;
if(e.id==="crime_offer"&&![2,3].includes(s.answers.stayhome)&&s.stats.i>45&&s.stats.gambling<15&&s.stats.substance<10)return false;
if(e.id==="date"&&["คบกัน","อยู่ด้วยกัน"].includes(state.relationship))return false;
if(e.id==="dating"&&state.relationship==="แยกทาง")return false;
if(["office","raise","fired","promotion","layoff"].includes(e.id)&&["ธุรกิจ","อิสระ"].includes(state.mode))return false;
if(["cmjob","kkjob","skjob","hyjob","bkk_local","bkkwork","localwork","regionalwork","teacher1","tech1","trade1","service1"].includes(e.id)&&["พึ่งครอบครัว","พักที่บ้าน","เกี่ยวข้องอาชญากรรม","ฟื้นตัว","ดูแลครอบครัว"].includes(state.mode))return false;
const professional={med2:"แพทย์",nurse2:"พยาบาล",law1:"ทนายความ",law2:"ทนายความ",police1:"ตำรวจ",police2:"ตำรวจ",judge1:"ผู้พิพากษา",judge2:"ผู้พิพากษา",actor2:"นักแสดง",athlete2:"นักกีฬา",artist_mid:"นักแสดง"};if(professional[e.id]&&state.goal&&state.goal!==professional[e.id])return false;
if(["owner1","owner2"].includes(e.id)&&state.goal&&state.goal!=="เจ้าของธุรกิจ"&&state.mode!=="ธุรกิจ")return false;
if(["switch1","career_reset","office","raise","fired","bribe","employee","layoff","owner1","owner2","med2","nurse2","law1","law2","police1","police2","judge2","actor2","athlete2","promotion"].includes(e.id)&&["พึ่งครอบครัว","เกี่ยวข้องอาชญากรรม","ฟื้นตัว","ดูแลครอบครัว"].includes(state.mode))return false;
if(["med2","nurse2","law2","police2","judge2","actor2","athlete2","teacher1","tech1","trade1","service1"].includes(e.id)&&state.mode==="ธุรกิจ")return false;
if(["love_drama","love_drama2"].includes(e.id)&&["โสด","แยกทาง"].includes(state.relationship))return false;if(e.origin&&s.origin?.[e.origin[0]]!==e.origin[1])return false;if(e.after){const n=s.answers[e.after];if(!Number.isInteger(n)||(e.choiceGate&&!e.choiceGate.includes(n)))return false}return LIFE.eligible(e,s)}
const callbacks={child:[["glass",[1],"คุณนึกถึงวันที่เคยโทษเมฆเรื่องแก้วแตก และสิ่งที่เกิดตามมา"],["glass",[0,3],"คุณนึกถึงวันที่แม่เคยฟังคุณยอมรับว่าเป็นคนทำแก้วแตก"]],return:[["school_b",[2],"ฟ้าเคยรู้สึกกลัวคุณจากเหตุการณ์บ้านตัวต่อพังในวัยเด็ก"],["school_b",[0,1,3],"คุณยังจำบ้านตัวต่อที่เคยสร้างกับฟ้าในห้องอนุบาล"]],reunion:[["betray_a",[0,1,2,3],"เรื่องเงินธุรกิจที่เคยคุยกันยังเป็นส่วนหนึ่งของความทรงจำของทั้งคู่"]],pub:[["campus_a",[0,1,2,3],"คุณจำแพรได้จากกลุ่มเพื่อนมหาวิทยาลัย"]],family:[["love1",[1,3],"หลังจากความสัมพันธ์เดิมสิ้นสุดลง คุณกำลังทบทวนชีวิตในแบบที่ต้องการ"]]};
function storyFor(e){const lead=[];if(e.id==="family"&&lifeState().parent==="มีลูก")lead.push("คุณมีลูกแล้ว และกำลังทบทวนว่าจะจัดชีวิตครอบครัวในช่วงต่อไปอย่างไร");if(e.id==="birth"&&s.origin){lead.push("เรื่องราวของ "+s.origin.name+" เริ่มต้นขึ้นแล้ว"+(s.origin.province?" ณ "+s.origin.province:""));for(const [k,choices] of Object.entries(originSets))lead.push(choices[s.origin[k]].story)}const variant=e.after&&e.variants?.[s.answers[e.after]];if(variant)lead.push(variant);for(const [id,choices,txt] of [...(e.cross||[]),...(callbacks[e.id]||[])])if(choices.includes(s.answers[id]))lead.push(txt);return [...lead,e.id==="child"?e.story.replace("ลูกวัยห้าขวบ","ลูก"):e.story].join("\n\n")}
function advance(){while(s.at<events.length&&(!allowed(events[s.at])||Object.hasOwn(s.answers,events[s.at].id)))s.at++;s.done=s.at>=events.length}
function begin(o=null){s=fresh(o);advance();save();view="play";render()}
function restore(){s=load();if(!s)return begin();if(s.pending){s.last=s.pending;const item=s.history[s.history.length-1];if(item&&item.id===s.pending.id)item.changes=s.pending.changes;s.pending=null;s.at++;}advance();save();view="play";render()}
function choose(e,n){if(s.pending||s.done||events[s.at]!==e||!e.choices[n])return;const c=e.choices[n];s.answers[e.id]=n;const changes=LIFE.apply(s.stats,LIFE.delta(e,n));s.history.push({id:e.id,age:e.age,title:e.title,label:c.label,result:c.result,changes});s.last={id:e.id,result:c.result,label:c.label,changes};s.at++;advance();save();render();document.getElementById("latest-outcome")?.scrollIntoView?.({block:"start",behavior:"instant"})}

function newGame(){if(s&&!s.done&&!confirm("เริ่มชีวิตใหม่และแทนที่บันทึกเดิมหรือไม่?"))return;view="setup";render()}
function scene(){const a=el("div",undefined,"scene");app.replaceChildren(a);return a}
function renderSetup(){const a=scene();add(a,el("div","สร้างตัวละคร","kicker"),el("h2","ชีวิตของคุณเริ่มต้นที่ไหน"),el("p","เลือกจุดเริ่มต้นของชีวิตในประเทศไทย สภาพแวดล้อมส่งผลต่อโอกาสและเรื่องราว แต่ไม่ได้กำหนดความดีหรืออนาคตของคุณ","muted"));const form=el("form",undefined,"originform");const name=el("input");name.type="text";name.maxLength=40;name.placeholder="ชื่อตัวละคร";name.autocomplete="off";const province=el("select");for(const city of window.CITIES){const opt=el("option",city);opt.value=city;province.append(opt)}const nameLabel=el("label","ชื่อตัวละคร");nameLabel.append(name);const provLabel=el("label","เมืองหรือจังหวัดเกิด");provLabel.append(province);add(form,nameLabel,provLabel);const selections={};const labelsBy={place:"ลักษณะพื้นที่เกิด",family:"ฐานะครอบครัว",home:"สภาพแวดล้อมในครอบครัว"},defaults={place:"town",family:"ordinary",home:"warm"};for(const [k,opts] of Object.entries(originSets)){const group=el("fieldset");group.append(el("legend",labelsBy[k]));const wrap=el("div",undefined,"originoptions");for(const [id,opt] of Object.entries(opts)){const label=el("label",undefined,"originoption"),radio=el("input");radio.type="radio";radio.name=k;radio.value=id;radio.checked=id===defaults[k];if(radio.checked)selections[k]=id;radio.onchange=()=>{if(radio.checked)selections[k]=id};const copy=el("span");add(copy,el("strong",opt.label),el("small",opt.description));add(label,radio,copy);wrap.append(label)}group.append(wrap);form.append(group)}const submit=el("button","เริ่มต้นชีวิต","primary");submit.type="submit";form.append(submit);form.onsubmit=ev=>{ev.preventDefault();begin({name:name.value,province:province.value,...selections})};add(a,form,btn("กลับหน้าแรก",()=>{view="start";render()},"small"))}
function changeText(k,v){return (v>0?"+":"")+v.toLocaleString("th-TH")+(LIFE.cash.includes(k)?" ฿":"")}
